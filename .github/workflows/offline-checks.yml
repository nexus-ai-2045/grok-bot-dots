name: Manual offline checks

# Run only when a maintainer explicitly requests it in GitHub Actions.
# No automatic trigger; adding this file does not start a run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run offline tests
        run: node --test test/*.test.js
      - name: Run offline mock demo
        run: node scripts/mock-demo.js
